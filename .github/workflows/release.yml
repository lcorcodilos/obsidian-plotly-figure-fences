name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          # Node 20's bundled npm is older than the npm that wrote
          # package-lock.json; an older npm can fail `npm ci` on a lockfile
          # written by a newer one ("Missing: X from lock file") even though
          # the lockfile itself is fine. Pin npm to match.
          npm install -g npm@11.6.2
          npm ci

      - name: Type check and build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Verify tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag ($tag) does not match manifest.json version ($version)."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css
